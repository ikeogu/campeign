[www]
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no

; PHP ships with upload_max_filesize=2M / post_max_size=8M by default, and this
; image copies no php.ini to override them — far below the 50MB-per-file limit
; Campaign uploads validate against (CampaignController::store), so every
; campaign video (and most images) was rejected before Laravel ever saw them.
; Sized to comfortably fit a few files per submission; keep in step with
; nginx's client_max_body_size (docker/nginx.conf) and Laravel's file rules.
php_admin_value[upload_max_filesize] = 60M
php_admin_value[post_max_size] = 150M
php_admin_value[max_input_time] = 300
